<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KRATOS — agent systems and programmable money</title>
  <desc id="desc">Terminal-style profile header for Gnanam Jaganathan, core developer of Zero and builder of Arc and Base products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#010409"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39d353"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#39d353"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .key{font-size:18px;font-weight:700;fill:#39d353}
      .value{font-size:18px;fill:#c9d1d9}
      .muted{font-size:14px;fill:#8b949e}
      .heading{font-size:26px;font-weight:700;fill:#e6edf3}
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="416" rx="16" stroke="url(#frame)" stroke-width="3"/>
  <rect x="24" y="24" width="1152" height="372" rx="14" fill="#0d1117" stroke="#21262d"/>
  <path d="M24 70H1176" stroke="#21262d"/>
  <circle cx="54" cy="47" r="7" fill="#f85149"/>
  <circle cx="80" cy="47" r="7" fill="#e3b341"/>
  <circle cx="106" cy="47" r="7" fill="#39d353"/>
  <text x="600" y="52" text-anchor="middle" class="mono muted">kratos@github: ~/systems</text>

  <rect x="68" y="126" width="190" height="190" rx="24" fill="#010409" stroke="#39d353" stroke-width="2"/>
  <text x="96" y="246" class="mono" font-size="88" font-weight="700" fill="#39d353">&gt;_</text>

  <text x="318" y="126" class="mono heading">gnanam1990 / KRATOS</text>
  <path d="M318 145H1128" stroke="#21262d" stroke-width="2"/>

  <text x="318" y="184" class="mono key">Role</text>
  <text x="480" y="184" class="mono value">Agent systems · programmable money</text>

  <text x="318" y="220" class="mono key">Work</text>
  <text x="480" y="220" class="mono value">Zero · Zero App · OpenClaude · agent infrastructure</text>

  <text x="318" y="256" class="mono key">Rails</text>
  <text x="480" y="256" class="mono value">Arc · Base · local-first runtimes</text>

  <text x="318" y="292" class="mono key">Stack</text>
  <text x="480" y="292" class="mono value">Go · TypeScript · Solidity · Rust · Python</text>

  <text x="318" y="328" class="mono key">Rule</text>
  <text x="480" y="328" class="mono value">reconcile unknown state before retry</text>

  <text x="318" y="364" class="mono key">Web</text>
  <text x="480" y="364" class="mono value">devkratos.info</text>
